<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Longview — European weather outlook</title>
<meta name="description" content="Medium-range weather outlook for anywhere in Europe, switchable between Open-Meteo's forecast models.">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#24597F">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;0,9..144,600;1,9..144,400&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #F4F6F8;
    --surface: #FFFFFF;
    --surface-alt: #ECF0F3;
    --border: #DFE5EA;
    --ink: #17232D;
    --ink-soft: #5B6B78;
    --ink-faint: #93A2AC;
    --cold: #2C6E9E;
    --warm: #DD8A2E;
    --accent: #24597F;
    --accent-soft: #E4EDF3;
    --radius-lg: 18px;
    --radius-md: 12px;
    --radius-sm: 8px;
    --shadow: 0 1px 2px rgba(23,35,45,0.04), 0 8px 24px rgba(23,35,45,0.06);
  }

  *{ box-sizing: border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background: var(--bg);
    color: var(--ink);
    font-family: "Work Sans", -apple-system, BlinkMacSystemFont, sans-serif;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }

  .shell{
    max-width: 640px;
    margin: 0 auto;
    padding: 20px 18px 60px;
  }

  /* ---- Header ---- */
  header.top{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap: 12px;
    margin-bottom: 18px;
  }
  .wordmark{
    font-family: "Fraunces", serif;
    font-weight: 500;
    font-size: 22px;
    letter-spacing: -0.01em;
    color: var(--ink);
  }
  .wordmark span{
    color: var(--cold);
    font-style: italic;
    font-weight: 400;
  }
  .model-picker{
    position: relative;
  }
  select.model-select{
    appearance: none;
    -webkit-appearance: none;
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--ink-soft);
    font-family: "Work Sans", sans-serif;
    font-size: 13px;
    font-weight: 500;
    padding: 8px 30px 8px 12px;
    border-radius: 999px;
    cursor: pointer;
    box-shadow: var(--shadow);
  }
  .model-picker::after{
    content: "";
    position: absolute;
    right: 12px;
    top: 50%;
    width: 7px;
    height: 7px;
    border-right: 1.5px solid var(--ink-soft);
    border-bottom: 1.5px solid var(--ink-soft);
    transform: translateY(-65%) rotate(45deg);
    pointer-events: none;
  }

  /* ---- Search ---- */
  .search-wrap{
    position: relative;
    margin-bottom: 18px;
  }
  .search-row{
    display:flex;
    gap: 8px;
  }
  input.search-input{
    flex: 1;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    padding: 12px 14px;
    font-size: 15px;
    font-family: "Work Sans", sans-serif;
    color: var(--ink);
    box-shadow: var(--shadow);
  }
  input.search-input:focus{
    outline: none;
    border-color: var(--cold);
  }
  button.locate-btn{
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    width: 44px;
    flex-shrink: 0;
    cursor: pointer;
    box-shadow: var(--shadow);
    display:flex;
    align-items:center;
    justify-content:center;
    color: var(--cold);
  }
  button.locate-btn:hover{ background: var(--accent-soft); }

  .suggestions{
    position: absolute;
    top: calc(100% + 6px);
    left: 0; right: 0;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    box-shadow: var(--shadow);
    overflow: hidden;
    z-index: 20;
    display: none;
  }
  .suggestions.open{ display: block; }
  .suggestion{
    padding: 10px 14px;
    font-size: 14px;
    cursor: pointer;
    border-bottom: 1px solid var(--border);
    display:flex;
    justify-content: space-between;
    gap: 10px;
  }
  .suggestion:last-child{ border-bottom: none; }
  .suggestion:hover{ background: var(--surface-alt); }
  .suggestion .place-name{ color: var(--ink); font-weight: 500; }
  .suggestion .place-region{ color: var(--ink-faint); font-size: 12.5px; white-space: nowrap; }

  /* ---- State messaging ---- */
  .message{
    text-align: center;
    color: var(--ink-soft);
    font-size: 14px;
    padding: 40px 20px;
  }
  .message.error{ color: #B14732; }

  /* ---- Hero ---- */
  .hero{
    display:none;
    padding: 22px 4px 6px;
  }
  .hero.visible{ display:block; }
  .place-line{
    font-size: 15px;
    color: var(--ink-soft);
    font-weight: 500;
    margin-bottom: 2px;
  }
  .hero-main{
    display:flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 18px;
  }
  .temp-block{
    display:flex;
    align-items: flex-start;
  }
  .temp-now{
    font-family: "Fraunces", serif;
    font-weight: 300;
    font-size: 84px;
    line-height: 0.9;
    letter-spacing: -0.02em;
    color: var(--ink);
  }
  .temp-unit{
    font-family: "Fraunces", serif;
    font-weight: 300;
    font-size: 34px;
    margin-top: 8px;
    color: var(--ink-soft);
  }
  .hero-icon{ width: 78px; height: 78px; flex-shrink: 0; }
  .condition-line{
    font-size: 16px;
    color: var(--ink);
    margin-top: 2px;
  }
  .hilo-line{
    font-size: 14px;
    color: var(--ink-soft);
    margin-top: 4px;
  }
  .feels-line{
    font-size: 13px;
    color: var(--ink-faint);
    margin-top: 10px;
  }

  /* ---- Section labels ---- */
  .section{
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow);
    margin-top: 16px;
    padding: 16px 0 18px;
  }
  .section-label{
    font-size: 11.5px;
    font-weight: 600;
    letter-spacing: 0.04em;
    color: var(--ink-faint);
    padding: 0 18px 12px;
  }

  /* ---- Hourly strip ---- */
  .hourly-scroll{
    display: flex;
    overflow-x: auto;
    gap: 2px;
    padding: 0 18px 4px;
    scrollbar-width: none;
  }
  .hourly-scroll::-webkit-scrollbar{ display:none; }
  .hour-col{
    flex: 0 0 56px;
    display:flex;
    flex-direction: column;
    align-items:center;
    gap: 8px;
    padding: 4px 0;
  }
  .hour-col .h-time{
    font-size: 12px;
    color: var(--ink-soft);
    font-weight: 500;
  }
  .hour-col .h-time.now{ color: var(--warm); font-weight: 700; }
  .hour-col .h-icon{ width: 26px; height: 26px; }
  .hour-col .h-temp{ font-size: 14px; font-weight: 600; color: var(--ink); }
  .hour-col .h-pop{ font-size: 11px; color: var(--cold); min-height: 14px; }

  /* ---- Daily list ---- */
  .daily-list{ padding: 0 18px; }
  .day-row{
    display:grid;
    grid-template-columns: 74px 26px 1fr 88px;
    align-items:center;
    gap: 12px;
    padding: 10px 0;
    border-top: 1px solid var(--border);
  }
  .day-row:first-child{ border-top: none; }
  .day-name{ font-size: 14px; font-weight: 500; color: var(--ink); }
  .day-name .date-sub{ display:block; font-size: 11.5px; color: var(--ink-faint); font-weight: 400; }
  .day-icon{ width: 22px; height: 22px; }
  .day-pop{
    font-size: 12px; color: var(--cold); text-align: right; min-width: 30px;
  }

  .range-track{
    position: relative;
    height: 4px;
    background: var(--surface-alt);
    border-radius: 3px;
  }
  .range-fill{
    position: absolute;
    top: 0; height: 4px;
    border-radius: 3px;
    background: linear-gradient(90deg, var(--cold), var(--warm));
  }
  .range-values{
    display:flex;
    justify-content: space-between;
    font-size: 13px;
    margin-top: 2px;
  }
  .range-values .lo{ color: var(--ink-faint); }
  .range-values .hi{ color: var(--ink); font-weight: 500; }
  .day-range-wrap{ display:flex; flex-direction:column; gap: 5px; }

  /* ---- Footer ---- */
  .footer{
    margin-top: 22px;
    text-align: center;
    font-size: 12px;
    color: var(--ink-faint);
    line-height: 1.6;
  }
  .footer a{ color: var(--ink-soft); }

  @media (max-width: 420px){
    .temp-now{ font-size: 68px; }
    .hero-icon{ width: 62px; height: 62px; }
  }
</style>
</head>
<body>

<div class="shell">

  <header class="top">
    <div class="wordmark">Long<span>view</span></div>
    <div class="model-picker">
      <select class="model-select" id="modelSelect" aria-label="Weather model">
        <option value="">Best match (auto)</option>
        <option value="ecmwf_ifs">ECMWF IFS HRES</option>
        <option value="icon_seamless">DWD ICON</option>
        <option value="gfs_seamless">NOAA GFS</option>
        <option value="meteofrance_seamless">Météo-France</option>
        <option value="ukmo_seamless">UK Met Office</option>
        <option value="meteoswiss_icon_seamless">MeteoSwiss ICON</option>
        <option value="knmi_seamless">KNMI (with ECMWF)</option>
        <option value="dmi_seamless">DMI (with ECMWF)</option>
        <option value="metno_nordic">MET Norway Nordic</option>
        <option value="gem_seamless">GEM Canada</option>
        <option value="jma_seamless">JMA Japan</option>
      </select>
    </div>
  </header>

  <div class="search-wrap">
    <div class="search-row">
      <input type="text" class="search-input" id="searchInput" placeholder="Search a place in Europe…" autocomplete="off">
      <button class="locate-btn" id="locateBtn" title="Use current location" aria-label="Use current location">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
          <circle cx="12" cy="12" r="3"></circle>
          <line x1="12" y1="2" x2="12" y2="5"></line>
          <line x1="12" y1="19" x2="12" y2="22"></line>
          <line x1="2" y1="12" x2="5" y2="12"></line>
          <line x1="19" y1="12" x2="22" y2="12"></line>
        </svg>
      </button>
    </div>
    <div class="suggestions" id="suggestions"></div>
  </div>

  <div id="messageArea"></div>

  <div class="hero" id="hero">
    <div class="place-line" id="placeLine"></div>
    <div class="hero-main">
      <div class="temp-block">
        <div class="temp-now" id="tempNow">–</div>
        <div class="temp-unit">°</div>
      </div>
      <div id="heroIcon" class="hero-icon"></div>
    </div>
    <div class="condition-line" id="conditionLine"></div>
    <div class="hilo-line" id="hiloLine"></div>
    <div class="feels-line" id="feelsLine"></div>
  </div>

  <div class="section" id="hourlySection" style="display:none;">
    <div class="section-label">NEXT 48 HOURS</div>
    <div class="hourly-scroll" id="hourlyScroll"></div>
  </div>

  <div class="section" id="dailySection" style="display:none;">
    <div class="section-label" id="dailyLabel">MEDIUM-RANGE OUTLOOK</div>
    <div class="daily-list" id="dailyList"></div>
  </div>

  <div class="footer" id="footer"></div>

</div>

<script>
(function(){

  const GEOCODE_URL = "https://geocoding-api.open-meteo.com/v1/search";
  const FORECAST_URL = "https://api.open-meteo.com/v1/forecast";

  const searchInput = document.getElementById('searchInput');
  const suggestionsEl = document.getElementById('suggestions');
  const modelSelect = document.getElementById('modelSelect');
  const locateBtn = document.getElementById('locateBtn');
  const messageArea = document.getElementById('messageArea');
  const hero = document.getElementById('hero');
  const hourlySection = document.getElementById('hourlySection');
  const dailySection = document.getElementById('dailySection');
  const footer = document.getElementById('footer');

  let currentPlace = null; // {name, admin1, country, latitude, longitude, timezone}
  let searchDebounce = null;

  // ---------------- Weather code -> icon + label ----------------
  // WMO weather interpretation codes
  function weatherInfo(code, isDay){
    const day = isDay !== false;
    const table = {
      0:  ["Clear sky", day ? iconSun() : iconMoon()],
      1:  ["Mainly clear", day ? iconSun() : iconMoon()],
      2:  ["Partly cloudy", day ? iconCloudSun() : iconCloudMoon()],
      3:  ["Overcast", iconCloud()],
      45: ["Fog", iconFog()],
      48: ["Rime fog", iconFog()],
      51: ["Light drizzle", iconDrizzle()],
      53: ["Drizzle", iconDrizzle()],
      55: ["Dense drizzle", iconDrizzle()],
      56: ["Freezing drizzle", iconDrizzle()],
      57: ["Freezing drizzle", iconDrizzle()],
      61: ["Slight rain", iconRain()],
      63: ["Rain", iconRain()],
      65: ["Heavy rain", iconRain()],
      66: ["Freezing rain", iconRain()],
      67: ["Freezing rain", iconRain()],
      71: ["Slight snow", iconSnow()],
      73: ["Snow", iconSnow()],
      75: ["Heavy snow", iconSnow()],
      77: ["Snow grains", iconSnow()],
      80: ["Rain showers", iconRain()],
      81: ["Rain showers", iconRain()],
      82: ["Violent showers", iconRain()],
      85: ["Snow showers", iconSnow()],
      86: ["Snow showers", iconSnow()],
      95: ["Thunderstorm", iconThunder()],
      96: ["Thunderstorm, hail", iconThunder()],
      99: ["Thunderstorm, hail", iconThunder()]
    };
    return table[code] || ["—", iconCloud()];
  }

  const ICON_STROKE = 'stroke="#24597F" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"';
  function svgWrap(inner){ return `<svg viewBox="0 0 24 24" ${ICON_STROKE}>${inner}</svg>`; }
  function iconSun(){ return svgWrap(`<circle cx="12" cy="12" r="4.2"/><line x1="12" y1="2.5" x2="12" y2="5"/><line x1="12" y1="19" x2="12" y2="21.5"/><line x1="2.5" y1="12" x2="5" y2="12"/><line x1="19" y1="12" x2="21.5" y2="12"/><line x1="5.1" y1="5.1" x2="6.8" y2="6.8"/><line x1="17.2" y1="17.2" x2="18.9" y2="18.9"/><line x1="5.1" y1="18.9" x2="6.8" y2="17.2"/><line x1="17.2" y1="6.8" x2="18.9" y2="5.1"/>`); }
  function iconMoon(){ return svgWrap(`<path d="M15.5 13.5A7 7 0 0 1 9.5 5a7 7 0 1 0 6 8.5Z"/>`); }
  function iconCloud(){ return svgWrap(`<path d="M6.5 18h11a4 4 0 0 0 .3-8 5.5 5.5 0 0 0-10.6 1.2A3.7 3.7 0 0 0 6.5 18Z"/>`); }
  function iconCloudSun(){ return svgWrap(`<circle cx="7" cy="7.5" r="2.6"/><line x1="7" y1="1.8" x2="7" y2="3.2"/><line x1="1.8" y1="7.5" x2="3.2" y2="7.5"/><line x1="2.9" y1="3.3" x2="3.9" y2="4.3"/><path d="M9.5 19h8.5a3.5 3.5 0 0 0 .2-7 5 5 0 0 0-9.4.9A3.3 3.3 0 0 0 9.5 19Z"/>`); }
  function iconCloudMoon(){ return svgWrap(`<path d="M9.2 8.6A3.3 3.3 0 0 1 6 3.5a3.3 3.3 0 1 0 2.6 5.3Z"/><path d="M9.5 19h8.5a3.5 3.5 0 0 0 .2-7 5 5 0 0 0-9.4.9A3.3 3.3 0 0 0 9.5 19Z"/>`); }
  function iconFog(){ return svgWrap(`<path d="M6.5 12.5h11a4 4 0 0 0 .3-8 5.5 5.5 0 0 0-10.6 1.2A3.7 3.7 0 0 0 6.5 12.5Z"/><line x1="3.5" y1="17" x2="20.5" y2="17"/><line x1="5.5" y1="20.2" x2="18.5" y2="20.2"/>`); }
  function iconDrizzle(){ return svgWrap(`<path d="M6.5 13h11a4 4 0 0 0 .3-8 5.5 5.5 0 0 0-10.6 1.2A3.7 3.7 0 0 0 6.5 13Z"/><line x1="9" y1="17" x2="8" y2="20"/><line x1="13" y1="17" x2="12" y2="20"/><line x1="17" y1="17" x2="16" y2="20"/>`); }
  function iconRain(){ return svgWrap(`<path d="M6.5 12h11a4 4 0 0 0 .3-8 5.5 5.5 0 0 0-10.6 1.2A3.7 3.7 0 0 0 6.5 12Z"/><line x1="8" y1="16" x2="6.5" y2="21"/><line x1="12.5" y1="16" x2="11" y2="21"/><line x1="17" y1="16" x2="15.5" y2="21"/>`); }
  function iconSnow(){ return svgWrap(`<path d="M6.5 12h11a4 4 0 0 0 .3-8 5.5 5.5 0 0 0-10.6 1.2A3.7 3.7 0 0 0 6.5 12Z"/><line x1="7.5" y1="17" x2="7.5" y2="21.2"/><line x1="5.6" y1="18" x2="9.4" y2="20.2"/><line x1="9.4" y1="18" x2="5.6" y2="20.2"/><line x1="16.5" y1="17" x2="16.5" y2="21.2"/><line x1="14.6" y1="18" x2="18.4" y2="20.2"/><line x1="18.4" y1="18" x2="14.6" y2="20.2"/>`); }
  function iconThunder(){ return svgWrap(`<path d="M6.5 11h11a4 4 0 0 0 .3-8 5.5 5.5 0 0 0-10.6 1.2A3.7 3.7 0 0 0 6.5 11Z"/><path d="M13 13.5 9.5 18h3l-1 3.5 4.5-5.5h-3Z" fill="#DD8A2E" stroke="#DD8A2E"/>`); }

  // ---------------- Geocoding ----------------
  searchInput.addEventListener('input', () => {
    const q = searchInput.value.trim();
    clearTimeout(searchDebounce);
    if(q.length < 2){ suggestionsEl.classList.remove('open'); return; }
    searchDebounce = setTimeout(() => runGeocode(q), 280);
  });

  document.addEventListener('click', (e) => {
    if(!suggestionsEl.contains(e.target) && e.target !== searchInput){
      suggestionsEl.classList.remove('open');
    }
  });

  async function runGeocode(query){
    try{
      const url = `${GEOCODE_URL}?name=${encodeURIComponent(query)}&count=8&language=en&format=json`;
      const res = await fetch(url);
      const data = await res.json();
      renderSuggestions(data.results || []);
    }catch(err){
      suggestionsEl.classList.remove('open');
    }
  }

  function renderSuggestions(results){
    if(!results.length){ suggestionsEl.classList.remove('open'); return; }
    suggestionsEl.innerHTML = results.map((r, i) => {
      const region = [r.admin1, r.country].filter(Boolean).join(', ');
      return `<div class="suggestion" data-idx="${i}">
        <span class="place-name">${escapeHtml(r.name)}</span>
        <span class="place-region">${escapeHtml(region)}</span>
      </div>`;
    }).join('');
    suggestionsEl.classList.add('open');
    Array.from(suggestionsEl.querySelectorAll('.suggestion')).forEach((el, i) => {
      el.addEventListener('click', () => {
        const r = results[i];
        selectPlace({
          name: r.name,
          admin1: r.admin1,
          country: r.country,
          latitude: r.latitude,
          longitude: r.longitude
        });
      });
    });
  }

  function escapeHtml(s){
    return (s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function selectPlace(place){
    currentPlace = place;
    searchInput.value = place.name;
    suggestionsEl.classList.remove('open');
    loadForecast();
  }

  locateBtn.addEventListener('click', () => {
    if(!navigator.geolocation){
      showMessage('Location access is not available in this browser.', true);
      return;
    }
    showMessage('Finding your location…');
    navigator.geolocation.getCurrentPosition(async (pos) => {
      const { latitude, longitude } = pos.coords;
      // Reverse-lookup a friendly name via the geocoding search on nearest coordinates isn't
      // directly supported, so label it generically and let the forecast timezone fill in detail.
      selectPlace({ name: 'Current location', admin1: '', country: '', latitude, longitude });
    }, () => {
      showMessage('Could not get your location — search for a place instead.', true);
    });
  });

  modelSelect.addEventListener('change', () => {
    if(currentPlace) loadForecast();
  });

  // ---------------- Forecast ----------------
  async function loadForecast(){
    if(!currentPlace) return;
    showMessage('Loading forecast…');
    hero.classList.remove('visible');
    hourlySection.style.display = 'none';
    dailySection.style.display = 'none';

    const { latitude, longitude } = currentPlace;
    const model = modelSelect.value;
    const params = new URLSearchParams({
      latitude, longitude,
      current: 'temperature_2m,apparent_temperature,weather_code,is_day',
      hourly: 'temperature_2m,weather_code,precipitation_probability,is_day',
      daily: 'weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max',
      timezone: 'auto',
      forecast_days: '16'
    });
    if(model) params.set('models', model);

    try{
      const res = await fetch(`${FORECAST_URL}?${params.toString()}`);
      if(!res.ok){
        const errBody = await res.json().catch(() => ({}));
        throw new Error(errBody.reason || `Request failed (${res.status})`);
      }
      const data = await res.json();
      renderForecast(data);
    }catch(err){
      showMessage(`Couldn't load the forecast — ${err.message}`, true);
    }
  }

  function renderForecast(data){
    messageArea.innerHTML = '';

    // ---- Hero ----
    const region = [currentPlace.admin1, currentPlace.country].filter(Boolean).join(', ');
    document.getElementById('placeLine').textContent = region ? `${currentPlace.name} · ${region}` : currentPlace.name;

    const cur = data.current;
    const [condLabel, condIcon] = weatherInfo(cur.weather_code, cur.is_day === 1);
    document.getElementById('tempNow').textContent = Math.round(cur.temperature_2m);
    document.getElementById('heroIcon').innerHTML = condIcon;
    document.getElementById('conditionLine').textContent = condLabel;
    document.getElementById('feelsLine').textContent = `Feels like ${Math.round(cur.apparent_temperature)}°`;

    const todayHi = Math.round(data.daily.temperature_2m_max[0]);
    const todayLo = Math.round(data.daily.temperature_2m_min[0]);
    document.getElementById('hiloLine').textContent = `H:${todayHi}°  L:${todayLo}°`;

    hero.classList.add('visible');

    // ---- Hourly (next 48h from current hour) ----
    const nowIso = data.hourly.time.findIndex(t => new Date(t) >= new Date(cur.time));
    const startIdx = nowIso === -1 ? 0 : nowIso;
    const hourlyScroll = document.getElementById('hourlyScroll');
    let hourlyHtml = '';
    for(let i = startIdx; i < Math.min(startIdx + 48, data.hourly.time.length); i++){
      const t = new Date(data.hourly.time[i]);
      const isNow = i === startIdx;
      const label = isNow ? 'Now' : t.toLocaleTimeString([], { hour: 'numeric' });
      const [, icon] = weatherInfo(data.hourly.weather_code[i], data.hourly.is_day[i] === 1);
      const pop = data.hourly.precipitation_probability[i];
      hourlyHtml += `<div class="hour-col">
        <div class="h-time ${isNow ? 'now' : ''}">${label}</div>
        <div class="h-icon">${icon}</div>
        <div class="h-temp">${Math.round(data.hourly.temperature_2m[i])}°</div>
        <div class="h-pop">${pop >= 20 ? pop + '%' : ''}</div>
      </div>`;
    }
    hourlyScroll.innerHTML = hourlyHtml;
    hourlySection.style.display = 'block';

    // ---- Daily ----
    const days = data.daily.time.length;
    const allMins = data.daily.temperature_2m_min;
    const allMaxs = data.daily.temperature_2m_max;
    const rangeMin = Math.min(...allMins);
    const rangeMax = Math.max(...allMaxs);
    const span = Math.max(rangeMax - rangeMin, 1);

    const dailyList = document.getElementById('dailyList');
    let dailyHtml = '';
    for(let i = 0; i < days; i++){
      const t = new Date(data.daily.time[i] + 'T12:00:00');
      const dayLabel = i === 0 ? 'Today' : t.toLocaleDateString([], { weekday: 'short' });
      const dateSub = t.toLocaleDateString([], { day: 'numeric', month: 'short' });
      const [, icon] = weatherInfo(data.daily.weather_code[i], true);
      const lo = Math.round(allMins[i]);
      const hi = Math.round(allMaxs[i]);
      const leftPct = ((allMins[i] - rangeMin) / span) * 100;
      const widthPct = ((allMaxs[i] - allMins[i]) / span) * 100;
      const pop = data.daily.precipitation_probability_max[i];

      dailyHtml += `<div class="day-row">
        <div class="day-name">${dayLabel}<span class="date-sub">${dateSub}</span></div>
        <div class="day-icon">${icon}</div>
        <div class="day-range-wrap">
          <div class="range-values"><span class="lo">${lo}°</span><span class="hi">${hi}°</span></div>
          <div class="range-track"><div class="range-fill" style="left:${leftPct}%; width:${widthPct}%;"></div></div>
        </div>
        <div class="day-pop">${pop >= 20 ? pop + '%' : ''}</div>
      </div>`;
    }
    dailyList.innerHTML = dailyHtml;
    document.getElementById('dailyLabel').textContent = `${days}-DAY OUTLOOK`;
    dailySection.style.display = 'block';

    // ---- Footer ----
    const modelLabel = modelSelect.options[modelSelect.selectedIndex].text;
    const updated = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    footer.innerHTML = `Data: <a href="https://open-meteo.com" target="_blank" rel="noopener">Open-Meteo</a> · Model: ${escapeHtml(modelLabel)} · Updated ${updated}`;
  }

  function showMessage(text, isError){
    messageArea.innerHTML = `<div class="message ${isError ? 'error' : ''}">${escapeHtml(text)}</div>`;
  }

  // Default landing message
  showMessage('Search for a place in Europe to see its forecast.');

})();
</script>

</body>
</html>
