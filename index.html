<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Longview — European weather outlook</title>
<meta name="description" content="Medium-range weather outlook for anywhere in Europe, switchable between Open-Meteo's forecast models.">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#24597F">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #EEF1F4;
    --surface: #FFFFFF;
    --surface-alt: #E6EAEE;
    --border: #D2D9DF;
    --ink: #0B1620;
    --ink-soft: #42505C;
    --ink-faint: #64727C;
    --cold: #1E6FB8;
    --warm: #E08300;
    --accent: #17547E;
    --accent-soft: #DCEAF5;
    --hero-fg: #FFFFFF;
    --hero-fg-soft: rgba(255,255,255,0.88);
    --hero-fg-faint: rgba(255,255,255,0.68);
    --radius-lg: 20px;
    --radius-md: 12px;
    --radius-sm: 8px;
    --shadow: 0 1px 2px rgba(11,22,32,0.05), 0 8px 24px rgba(11,22,32,0.08);
  }

  *{ box-sizing: border-box; }
  html,body{ margin:0; padding:0; max-width: 100%; overflow-x: hidden; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  body{
    background: #2A7FCC;
    color: var(--ink);
    font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
    width: 100%;
  }

  /* Fixed full-viewport sky background — stays put while content scrolls over it, like iOS Weather */
  #sky{
    position: fixed;
    inset: 0;
    z-index: -1;
    background-image: radial-gradient(circle at 22% 10%, rgba(255,214,120,0.55) 0%, rgba(255,214,120,0) 40%);
    background-color: #2A7FCC;
    background-repeat: no-repeat;
    transition: background-color 0.6s ease;
  }

  .shell{
    max-width: 640px;
    width: 100%;
    margin: 0 auto;
    padding: 20px 18px 60px;
    overflow-x: hidden;
  }

  /* ---- Header ---- */
  header.top{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap: 10px;
    margin-bottom: 18px;
  }
  .wordmark{
    font-family: "Inter", sans-serif;
    font-weight: 800;
    font-size: 21px;
    letter-spacing: -0.02em;
    color: #FFFFFF;
    flex-shrink: 0;
    text-shadow: 0 1px 6px rgba(0,0,0,0.18);
  }
  .wordmark span{
    color: rgba(255,255,255,0.78);
    font-weight: 500;
  }
  .model-picker{
    position: relative;
    flex: 1 1 auto;
    min-width: 0;
    max-width: 62%;
  }
  select.model-select{
    appearance: none;
    -webkit-appearance: none;
    background: rgba(255,255,255,0.78);
    backdrop-filter: blur(20px) saturate(160%);
    -webkit-backdrop-filter: blur(20px) saturate(160%);
    border: 1px solid rgba(255,255,255,0.5);
    color: var(--ink-soft);
    font-family: "Inter", sans-serif;
    font-size: 16px;
    font-weight: 500;
    padding: 8px 30px 8px 12px;
    border-radius: 999px;
    cursor: pointer;
    box-shadow: var(--shadow);
    width: 100%;
    max-width: 100%;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .model-picker::after{
    content: "";
    position: absolute;
    right: 12px;
    top: 50%;
    width: 7px;
    height: 7px;
    border-right: 1.5px solid var(--ink-soft);
    border-bottom: 1.5px solid var(--ink-soft);
    transform: translateY(-65%) rotate(45deg);
    pointer-events: none;
  }

  /* ---- Search ---- */
  .search-wrap{
    position: relative;
    margin-bottom: 18px;
  }
  .search-row{
    display:flex;
    gap: 8px;
  }
  input.search-input{
    flex: 1;
    background: rgba(255,255,255,0.78);
    backdrop-filter: blur(20px) saturate(160%);
    -webkit-backdrop-filter: blur(20px) saturate(160%);
    border: 1px solid rgba(255,255,255,0.5);
    border-radius: var(--radius-md);
    padding: 12px 14px;
    font-size: 16px;
    font-family: "Inter", sans-serif;
    color: var(--ink);
    box-shadow: var(--shadow);
  }
  input.search-input::placeholder{ color: var(--ink-faint); }
  input.search-input:focus{
    outline: none;
    border-color: var(--cold);
  }
  button.locate-btn{
    background: rgba(255,255,255,0.78);
    backdrop-filter: blur(20px) saturate(160%);
    -webkit-backdrop-filter: blur(20px) saturate(160%);
    border: 1px solid rgba(255,255,255,0.5);
    border-radius: var(--radius-md);
    width: 44px;
    flex-shrink: 0;
    cursor: pointer;
    box-shadow: var(--shadow);
    display:flex;
    align-items:center;
    justify-content:center;
    color: var(--cold);
  }
  button.locate-btn:hover{ background: var(--accent-soft); }

  .suggestions{
    position: absolute;
    top: calc(100% + 6px);
    left: 0; right: 0;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    box-shadow: var(--shadow);
    overflow: hidden;
    z-index: 20;
    display: none;
  }
  .suggestions.open{ display: block; }
  .suggestion{
    padding: 10px 14px;
    font-size: 14px;
    cursor: pointer;
    border-bottom: 1px solid var(--border);
    display:flex;
    justify-content: space-between;
    gap: 10px;
  }
  .suggestion:last-child{ border-bottom: none; }
  .suggestion:hover{ background: var(--surface-alt); }
  .suggestion .place-name{ color: var(--ink); font-weight: 500; }
  .suggestion .place-region{ color: var(--ink-faint); font-size: 12.5px; white-space: nowrap; }

  /* ---- State messaging ---- */
  .message{
    text-align: center;
    color: var(--hero-fg-soft);
    font-size: 14px;
    font-weight: 500;
    padding: 60px 24px;
    text-shadow: 0 1px 4px rgba(0,0,0,0.15);
  }
  .message.error{ color: #FFD3C4; }

  /* ---- Hero ---- */
  /* Sits directly on the #sky background (no card box), like iOS Weather's current-conditions view */
  .hero{
    display:none;
    padding: 8px 4px 26px;
  }
  .hero.visible{ display:block; }
  .place-line{
    font-size: 15px;
    color: var(--hero-fg-soft);
    font-weight: 600;
    margin-bottom: 4px;
    letter-spacing: -0.01em;
    text-shadow: 0 1px 6px rgba(0,0,0,0.18);
  }
  .hero-main{
    display:flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 18px;
  }
  .temp-block{
    display:flex;
    align-items: flex-start;
  }
  .temp-now{
    font-family: "Inter", sans-serif;
    font-weight: 700;
    font-size: 80px;
    line-height: 0.9;
    letter-spacing: -0.03em;
    color: var(--hero-fg);
    text-shadow: 0 2px 10px rgba(0,0,0,0.18);
  }
  .temp-unit{
    font-family: "Inter", sans-serif;
    font-weight: 400;
    font-size: 32px;
    margin-top: 6px;
    color: var(--hero-fg-soft);
    text-shadow: 0 2px 10px rgba(0,0,0,0.18);
  }
  .hero-icon{ width: 74px; height: 74px; flex-shrink: 0; filter: drop-shadow(0 2px 8px rgba(0,0,0,0.15)); }
  .condition-line{
    font-size: 17px;
    font-weight: 600;
    color: var(--hero-fg);
    margin-top: 2px;
    text-shadow: 0 1px 6px rgba(0,0,0,0.18);
  }
  .hilo-line{
    font-size: 14px;
    font-weight: 500;
    color: var(--hero-fg-soft);
    margin-top: 4px;
    text-shadow: 0 1px 6px rgba(0,0,0,0.18);
  }
  .feels-line{
    font-size: 13px;
    font-weight: 500;
    color: var(--hero-fg-faint);
    margin-top: 10px;
    text-shadow: 0 1px 6px rgba(0,0,0,0.18);
  }

  /* ---- Section labels ---- */
  .section{
    background: rgba(255,255,255,0.72);
    backdrop-filter: blur(24px) saturate(160%);
    -webkit-backdrop-filter: blur(24px) saturate(160%);
    border: 1px solid rgba(255,255,255,0.5);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow);
    margin-top: 16px;
    padding: 16px 0 18px;
  }
  .section-label{
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.05em;
    color: var(--ink-soft);
    padding: 0 18px 12px;
  }

  /* ---- Hourly strip ---- */
  .hourly-scroll{
    display: flex;
    overflow-x: auto;
    gap: 2px;
    padding: 0 18px 4px;
    scrollbar-width: none;
  }
  .hourly-scroll::-webkit-scrollbar{ display:none; }
  .hour-col{
    flex: 0 0 56px;
    display:flex;
    flex-direction: column;
    align-items:center;
    gap: 8px;
    padding: 4px 0;
  }
  .hour-col .h-time{
    font-size: 12px;
    color: var(--ink-soft);
    font-weight: 500;
  }
  .hour-col .h-time.now{ color: var(--warm); font-weight: 700; }
  .hour-col .h-icon{ width: 26px; height: 26px; }
  .hour-col .h-temp{ font-size: 14px; font-weight: 600; color: var(--ink); }
  .hour-col .h-pop{ font-size: 11px; color: var(--cold); min-height: 14px; }

  /* ---- Daily list ---- */
  .daily-list{ padding: 0 18px; }
  .day-row{
    display:grid;
    grid-template-columns: 74px 26px 1fr 88px;
    align-items:center;
    gap: 12px;
    padding: 10px 0;
    border-top: 1px solid var(--border);
  }
  .day-row:first-child{ border-top: none; }
  .day-name{ font-size: 14px; font-weight: 500; color: var(--ink); }
  .day-name .date-sub{ display:block; font-size: 11.5px; color: var(--ink-faint); font-weight: 400; }
  .day-icon{ width: 22px; height: 22px; }
  .day-pop{
    font-size: 12px; color: var(--cold); text-align: right; min-width: 30px;
  }

  .range-track{
    position: relative;
    height: 4px;
    background: var(--surface-alt);
    border-radius: 3px;
  }
  .range-fill{
    position: absolute;
    top: 0; height: 4px;
    border-radius: 3px;
    background: linear-gradient(90deg, var(--cold), var(--warm));
  }
  .range-values{
    display:flex;
    justify-content: space-between;
    font-size: 13px;
    margin-top: 2px;
  }
  .range-values .lo{ color: var(--ink-faint); }
  .range-values .hi{ color: var(--ink); font-weight: 500; }
  .day-range-wrap{ display:flex; flex-direction:column; gap: 5px; }

  /* ---- Footer ---- */
  .footer{
    margin-top: 22px;
    text-align: center;
    font-size: 12px;
    color: var(--hero-fg-faint);
    line-height: 1.6;
    text-shadow: 0 1px 4px rgba(0,0,0,0.15);
  }
  .footer a{ color: var(--hero-fg-soft); }

  @media (max-width: 420px){
    .temp-now{ font-size: 68px; }
    .hero-icon{ width: 62px; height: 62px; }
  }
</style>
</head>
<body>
<div id="sky" aria-hidden="true"></div>

<div class="shell">

  <header class="top">
    <div class="wordmark">Long<span>view</span></div>
    <div class="model-picker">
      <select class="model-select" id="modelSelect" aria-label="Weather model">
        <option value="">Best match (auto)</option>
        <option value="ecmwf_ifs">ECMWF IFS HRES</option>
        <option value="icon_seamless">DWD ICON</option>
        <option value="gfs_seamless">NOAA GFS</option>
        <option value="meteofrance_seamless">Météo-France</option>
        <option value="ukmo_seamless">UK Met Office</option>
        <option value="meteoswiss_icon_seamless">MeteoSwiss ICON</option>
        <option value="knmi_seamless">KNMI (with ECMWF)</option>
        <option value="dmi_seamless">DMI (with ECMWF)</option>
        <option value="metno_nordic">MET Norway Nordic</option>
        <option value="gem_seamless">GEM Canada</option>
        <option value="jma_seamless">JMA Japan</option>
      </select>
    </div>
  </header>

  <div class="search-wrap">
    <div class="search-row">
      <input type="text" class="search-input" id="searchInput" placeholder="Search a place in Europe…" autocomplete="off">
      <button class="locate-btn" id="locateBtn" title="Use current location" aria-label="Use current location">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
          <circle cx="12" cy="12" r="3"></circle>
          <line x1="12" y1="2" x2="12" y2="5"></line>
          <line x1="12" y1="19" x2="12" y2="22"></line>
          <line x1="2" y1="12" x2="5" y2="12"></line>
          <line x1="19" y1="12" x2="22" y2="12"></line>
        </svg>
      </button>
    </div>
    <div class="suggestions" id="suggestions"></div>
  </div>

  <div id="messageArea"></div>

  <div class="hero" id="hero">
    <div class="place-line" id="placeLine"></div>
    <div class="hero-main">
      <div class="temp-block">
        <div class="temp-now" id="tempNow">–</div>
        <div class="temp-unit">°</div>
      </div>
      <div id="heroIcon" class="hero-icon"></div>
    </div>
    <div class="condition-line" id="conditionLine"></div>
    <div class="hilo-line" id="hiloLine"></div>
    <div class="feels-line" id="feelsLine"></div>
  </div>

  <div class="section" id="hourlySection" style="display:none;">
    <div class="section-label">NEXT 48 HOURS</div>
    <div class="hourly-scroll" id="hourlyScroll"></div>
  </div>

  <div class="section" id="dailySection" style="display:none;">
    <div class="section-label" id="dailyLabel">MEDIUM-RANGE OUTLOOK</div>
    <div class="daily-list" id="dailyList"></div>
  </div>

  <div class="footer" id="footer"></div>

</div>

<script>
(function(){

  const GEOCODE_URL = "https://geocoding-api.open-meteo.com/v1/search";
  const FORECAST_URL = "https://api.open-meteo.com/v1/forecast";

  const searchInput = document.getElementById('searchInput');
  const suggestionsEl = document.getElementById('suggestions');
  const modelSelect = document.getElementById('modelSelect');
  const locateBtn = document.getElementById('locateBtn');
  const messageArea = document.getElementById('messageArea');
  const hero = document.getElementById('hero');
  const hourlySection = document.getElementById('hourlySection');
  const dailySection = document.getElementById('dailySection');
  const footer = document.getElementById('footer');

  let currentPlace = null; // {name, admin1, country, latitude, longitude, timezone}
  let searchDebounce = null;

  // ---------------- Weather code -> icon + label ----------------
  // WMO weather interpretation codes
  // tone: 'light' = icon sits on a white card, 'dark' = icon sits on the gradient hero
  function weatherInfo(code, isDay, tone){
    const day = isDay !== false;
    const t = tone || 'light';
    const table = {
      0:  ["Clear sky", day ? iconSun(t) : iconMoon(t)],
      1:  ["Mainly clear", day ? iconSun(t) : iconMoon(t)],
      2:  ["Partly cloudy", day ? iconCloudSun(t) : iconCloudMoon(t)],
      3:  ["Overcast", iconCloud(t)],
      45: ["Fog", iconFog(t)],
      48: ["Rime fog", iconFog(t)],
      51: ["Light drizzle", iconDrizzle(t)],
      53: ["Drizzle", iconDrizzle(t)],
      55: ["Dense drizzle", iconDrizzle(t)],
      56: ["Freezing drizzle", iconDrizzle(t)],
      57: ["Freezing drizzle", iconDrizzle(t)],
      61: ["Slight rain", iconRain(t)],
      63: ["Rain", iconRain(t)],
      65: ["Heavy rain", iconRain(t)],
      66: ["Freezing rain", iconRain(t)],
      67: ["Freezing rain", iconRain(t)],
      71: ["Slight snow", iconSnow(t)],
      73: ["Snow", iconSnow(t)],
      75: ["Heavy snow", iconSnow(t)],
      77: ["Snow grains", iconSnow(t)],
      80: ["Rain showers", iconRain(t)],
      81: ["Rain showers", iconRain(t)],
      82: ["Violent showers", iconRain(t)],
      85: ["Snow showers", iconSnow(t)],
      86: ["Snow showers", iconSnow(t)],
      95: ["Thunderstorm", iconThunder(t)],
      96: ["Thunderstorm, hail", iconThunder(t)],
      99: ["Thunderstorm, hail", iconThunder(t)]
    };
    return table[code] || ["—", iconCloud(t)];
  }

  // Sun/bolt stay the same vivid colour on any background; clouds, rain, snow, fog
  // swap palette depending on whether they sit on a white card ('light') or the
  // gradient hero ('dark') so they stay legible either way.
  const SUN_FILL = '#FFB020';
  const SUN_STROKE = '#E08300';
  const BOLT_FILL = '#FFB020';
  function tone(t, light, dark){ return t === 'dark' ? dark : light; }

  function svgWrap(inner, extra){ return `<svg viewBox="0 0 24 24" ${extra || ''}>${inner}</svg>`; }

  function iconSun(t){
    const ray = tone(t, '#C9821A', 'rgba(255,255,255,0.85)');
    return svgWrap(`
      <circle cx="12" cy="12" r="4.6" fill="${SUN_FILL}" stroke="${SUN_STROKE}" stroke-width="0.5"/>
      <g stroke="${ray}" stroke-width="1.8" stroke-linecap="round">
        <line x1="12" y1="2.3" x2="12" y2="4.6"/>
        <line x1="12" y1="19.4" x2="12" y2="21.7"/>
        <line x1="2.3" y1="12" x2="4.6" y2="12"/>
        <line x1="19.4" y1="12" x2="21.7" y2="12"/>
        <line x1="4.9" y1="4.9" x2="6.5" y2="6.5"/>
        <line x1="17.5" y1="17.5" x2="19.1" y2="19.1"/>
        <line x1="4.9" y1="19.1" x2="6.5" y2="17.5"/>
        <line x1="17.5" y1="6.5" x2="19.1" y2="4.9"/>
      </g>`);
  }
  function iconMoon(t){
    const fill = tone(t, '#3E4E5E', '#FFFFFF');
    return svgWrap(`<path d="M15.5 13.5A7 7 0 0 1 9.5 5a7 7 0 1 0 6 8.5Z" fill="${fill}"/>`);
  }
  function cloudPath(){ return `M6.5 18h11a4 4 0 0 0 .3-8 5.5 5.5 0 0 0-10.6 1.2A3.7 3.7 0 0 0 6.5 18Z`; }
  function iconCloud(t){
    const fill = tone(t, '#B7C3CD', 'rgba(255,255,255,0.94)');
    const stroke = tone(t, '#8B98A3', 'rgba(255,255,255,0.5)');
    return svgWrap(`<path d="${cloudPath()}" fill="${fill}" stroke="${stroke}" stroke-width="1"/>`);
  }
  function iconCloudSun(t){
    const cFill = tone(t, '#C3CDD5', 'rgba(255,255,255,0.94)');
    const cStroke = tone(t, '#8B98A3', 'rgba(255,255,255,0.5)');
    const ray = tone(t, '#C9821A', 'rgba(255,255,255,0.85)');
    return svgWrap(`
      <circle cx="7.2" cy="7" r="2.9" fill="${SUN_FILL}" stroke="${SUN_STROKE}" stroke-width="0.4"/>
      <g stroke="${ray}" stroke-width="1.4" stroke-linecap="round">
        <line x1="7.2" y1="1.6" x2="7.2" y2="3"/>
        <line x1="1.6" y1="7" x2="3" y2="7"/>
        <line x1="3.1" y1="3" x2="4.1" y2="4"/>
      </g>
      <path d="M9.5 19h8.5a3.5 3.5 0 0 0 .2-7 5 5 0 0 0-9.4.9A3.3 3.3 0 0 0 9.5 19Z" fill="${cFill}" stroke="${cStroke}" stroke-width="1"/>`);
  }
  function iconCloudMoon(t){
    const cFill = tone(t, '#C3CDD5', 'rgba(255,255,255,0.94)');
    const cStroke = tone(t, '#8B98A3', 'rgba(255,255,255,0.5)');
    const mFill = tone(t, '#3E4E5E', '#FFFFFF');
    return svgWrap(`
      <path d="M9.2 8.6A3.3 3.3 0 0 1 6 3.5a3.3 3.3 0 1 0 2.6 5.3Z" fill="${mFill}"/>
      <path d="M9.5 19h8.5a3.5 3.5 0 0 0 .2-7 5 5 0 0 0-9.4.9A3.3 3.3 0 0 0 9.5 19Z" fill="${cFill}" stroke="${cStroke}" stroke-width="1"/>`);
  }
  function iconFog(t){
    const fill = tone(t, '#B7C3CD', 'rgba(255,255,255,0.94)');
    const stroke = tone(t, '#8B98A3', 'rgba(255,255,255,0.5)');
    const line = tone(t, '#8B98A3', 'rgba(255,255,255,0.75)');
    return svgWrap(`<path d="M6.5 12.5h11a4 4 0 0 0 .3-8 5.5 5.5 0 0 0-10.6 1.2A3.7 3.7 0 0 0 6.5 12.5Z" fill="${fill}" stroke="${stroke}" stroke-width="1"/><g stroke="${line}" stroke-width="1.6" stroke-linecap="round"><line x1="3.5" y1="17" x2="20.5" y2="17"/><line x1="5.5" y1="20.2" x2="18.5" y2="20.2"/></g>`);
  }
  function iconDrizzle(t){
    const cFill = tone(t, '#B7C3CD', 'rgba(255,255,255,0.94)');
    const cStroke = tone(t, '#8B98A3', 'rgba(255,255,255,0.5)');
    const drop = tone(t, '#1E6FB8', '#CDE8FF');
    return svgWrap(`<path d="${cloudPath().replace('18h','13h').replace(/18Z$/,'13Z')}" fill="${cFill}" stroke="${cStroke}" stroke-width="1"/><g stroke="${drop}" stroke-width="1.8" stroke-linecap="round"><line x1="9" y1="17" x2="8" y2="20"/><line x1="13" y1="17" x2="12" y2="20"/><line x1="17" y1="17" x2="16" y2="20"/></g>`);
  }
  function iconRain(t){
    const cFill = tone(t, '#B7C3CD', 'rgba(255,255,255,0.94)');
    const cStroke = tone(t, '#8B98A3', 'rgba(255,255,255,0.5)');
    const drop = tone(t, '#1E6FB8', '#CDE8FF');
    return svgWrap(`<path d="M6.5 12h11a4 4 0 0 0 .3-8 5.5 5.5 0 0 0-10.6 1.2A3.7 3.7 0 0 0 6.5 12Z" fill="${cFill}" stroke="${cStroke}" stroke-width="1"/><g stroke="${drop}" stroke-width="1.9" stroke-linecap="round"><line x1="8" y1="16" x2="6.5" y2="21"/><line x1="12.5" y1="16" x2="11" y2="21"/><line x1="17" y1="16" x2="15.5" y2="21"/></g>`);
  }
  function iconSnow(t){
    const cFill = tone(t, '#B7C3CD', 'rgba(255,255,255,0.94)');
    const cStroke = tone(t, '#8B98A3', 'rgba(255,255,255,0.5)');
    const flake = tone(t, '#4F8FC2', '#EAF6FF');
    return svgWrap(`<path d="M6.5 12h11a4 4 0 0 0 .3-8 5.5 5.5 0 0 0-10.6 1.2A3.7 3.7 0 0 0 6.5 12Z" fill="${cFill}" stroke="${cStroke}" stroke-width="1"/><g stroke="${flake}" stroke-width="1.8" stroke-linecap="round"><line x1="7.5" y1="17" x2="7.5" y2="21.2"/><line x1="5.6" y1="18" x2="9.4" y2="20.2"/><line x1="9.4" y1="18" x2="5.6" y2="20.2"/><line x1="16.5" y1="17" x2="16.5" y2="21.2"/><line x1="14.6" y1="18" x2="18.4" y2="20.2"/><line x1="18.4" y1="18" x2="14.6" y2="20.2"/></g>`);
  }
  function iconThunder(t){
    const cFill = tone(t, '#8B98A3', 'rgba(255,255,255,0.85)');
    const cStroke = tone(t, '#5B6B78', 'rgba(255,255,255,0.4)');
    return svgWrap(`<path d="M6.5 11h11a4 4 0 0 0 .3-8 5.5 5.5 0 0 0-10.6 1.2A3.7 3.7 0 0 0 6.5 11Z" fill="${cFill}" stroke="${cStroke}" stroke-width="1"/><path d="M13 13.5 9.5 18h3l-1 3.5 4.5-5.5h-3Z" fill="${BOLT_FILL}" stroke="${BOLT_FILL}"/>`);
  }

  // ---------------- Sky background ----------------
  // Drives the fixed #sky layer behind the whole page — a gradient plus
  // lightweight atmospheric decoration (glow, cloud blobs, stars, rain/snow
  // texture) standing in for the photographic backgrounds iOS Weather uses,
  // built entirely from CSS gradients so nothing has to be fetched or hosted.
  const skyEl = document.getElementById('sky');

  function conditionGroup(code){
    if([95,96,99].includes(code)) return 'storm';
    if([71,73,75,77,85,86].includes(code)) return 'snow';
    if([45,48].includes(code)) return 'fog';
    if([51,53,55,56,57,61,63,65,66,67,80,81,82].includes(code)) return 'rain';
    if([2,3].includes(code)) return 'cloudy';
    return 'clear';
  }

  const SKY_COLORS = {
    clear:  { day: ['#5CB3F0','#2A7FCC','#135C99'], night: ['#1C2B45','#101A2E','#070B16'] },
    cloudy: { day: ['#8DA7BC','#5E7C94','#3C566B'], night: ['#384656','#232D37','#11161C'] },
    fog:    { day: ['#A2AFB8','#79868F','#545F68'], night: ['#4C5A66','#303B44','#181E24'] },
    rain:   { day: ['#7893A5','#526E82','#334A5C'], night: ['#3E4E5E','#263039','#12171C'] },
    snow:   { day: ['#A9B9C6','#7C8FA0','#55677A'], night: ['#4A5A6C','#2E3A48','#171E26'] },
    storm:  { day: ['#6B6785','#4A4560','#2A2638'], night: ['#3B3550','#211D33','#100E1C'] }
  };

  // Fixed, deterministic star field (percent positions) — reused for every clear/cloudy night.
  const STAR_POINTS = [
    [8,10],[18,6],[27,14],[35,4],[44,18],[52,8],[61,15],[70,5],[78,12],[88,7],
    [14,24],[24,30],[40,26],[58,28],[73,24],[85,30],[6,34],[95,20],[48,36],[30,40]
  ];

  function skyDecoration(group, isDay){
    const layers = [];

    if(group === 'clear'){
      layers.push(isDay
        ? 'radial-gradient(circle at 24% 12%, rgba(255,214,120,0.55) 0%, rgba(255,214,120,0) 42%)'
        : 'radial-gradient(circle at 78% 10%, rgba(255,255,255,0.55) 0%, rgba(255,255,255,0.12) 4%, rgba(255,255,255,0) 7%)');
    }

    if(['cloudy','rain','snow','storm','fog'].includes(group)){
      layers.push('radial-gradient(ellipse 60% 26% at 18% 20%, rgba(255,255,255,0.30), rgba(255,255,255,0) 70%)');
      layers.push('radial-gradient(ellipse 55% 24% at 78% 14%, rgba(255,255,255,0.22), rgba(255,255,255,0) 70%)');
      layers.push('radial-gradient(ellipse 70% 30% at 48% 32%, rgba(255,255,255,0.16), rgba(255,255,255,0) 70%)');
    }

    if(!isDay && (group === 'clear' || group === 'cloudy')){
      STAR_POINTS.forEach(([x,y]) => {
        layers.push(`radial-gradient(1.4px 1.4px at ${x}% ${y}%, rgba(255,255,255,0.85), rgba(255,255,255,0) 100%)`);
      });
    }

    if(group === 'rain' || group === 'storm'){
      layers.push('repeating-linear-gradient(115deg, rgba(255,255,255,0.10) 0 2px, rgba(255,255,255,0) 2px 18px)');
    }

    if(group === 'snow'){
      layers.push('radial-gradient(1.6px 1.6px at 15% 55%, rgba(255,255,255,0.5), rgba(255,255,255,0) 100%)');
      layers.push('radial-gradient(1.6px 1.6px at 35% 70%, rgba(255,255,255,0.5), rgba(255,255,255,0) 100%)');
      layers.push('radial-gradient(1.6px 1.6px at 55% 50%, rgba(255,255,255,0.5), rgba(255,255,255,0) 100%)');
      layers.push('radial-gradient(1.6px 1.6px at 75% 68%, rgba(255,255,255,0.5), rgba(255,255,255,0) 100%)');
      layers.push('radial-gradient(1.6px 1.6px at 90% 45%, rgba(255,255,255,0.5), rgba(255,255,255,0) 100%)');
    }

    return layers.join(', ');
  }

  function applySky(code, isDay){
    const group = conditionGroup(code);
    const stops = SKY_COLORS[group][isDay ? 'day' : 'night'];
    const baseGradient = `linear-gradient(165deg, ${stops[0]} 0%, ${stops[1]} 55%, ${stops[2]} 100%)`;
    const decoration = skyDecoration(group, isDay);
    skyEl.style.backgroundImage = decoration ? `${decoration}, ${baseGradient}` : baseGradient;
    const meta = document.querySelector('meta[name="theme-color"]');
    if(meta) meta.setAttribute('content', stops[1]);
  }

  // ---------------- Geocoding ----------------
  searchInput.addEventListener('input', () => {
    const q = searchInput.value.trim();
    clearTimeout(searchDebounce);
    if(q.length < 2){ suggestionsEl.classList.remove('open'); return; }
    searchDebounce = setTimeout(() => runGeocode(q), 280);
  });

  document.addEventListener('click', (e) => {
    if(!suggestionsEl.contains(e.target) && e.target !== searchInput){
      suggestionsEl.classList.remove('open');
    }
  });

  async function runGeocode(query){
    try{
      const url = `${GEOCODE_URL}?name=${encodeURIComponent(query)}&count=8&language=en&format=json`;
      const res = await fetch(url);
      const data = await res.json();
      renderSuggestions(data.results || []);
    }catch(err){
      suggestionsEl.classList.remove('open');
    }
  }

  function renderSuggestions(results){
    if(!results.length){ suggestionsEl.classList.remove('open'); return; }
    suggestionsEl.innerHTML = results.map((r, i) => {
      const region = [r.admin1, r.country].filter(Boolean).join(', ');
      return `<div class="suggestion" data-idx="${i}">
        <span class="place-name">${escapeHtml(r.name)}</span>
        <span class="place-region">${escapeHtml(region)}</span>
      </div>`;
    }).join('');
    suggestionsEl.classList.add('open');
    Array.from(suggestionsEl.querySelectorAll('.suggestion')).forEach((el, i) => {
      el.addEventListener('click', () => {
        const r = results[i];
        selectPlace({
          name: r.name,
          admin1: r.admin1,
          country: r.country,
          latitude: r.latitude,
          longitude: r.longitude
        });
      });
    });
  }

  function escapeHtml(s){
    return (s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function selectPlace(place){
    currentPlace = place;
    searchInput.value = place.name;
    suggestionsEl.classList.remove('open');
    loadForecast();
  }

  function useCurrentLocation(onFail){
    if(!navigator.geolocation){
      if(onFail) onFail();
      else showMessage('Location access is not available in this browser — search for a place instead.', true);
      return;
    }
    showMessage('Finding your location…');
    navigator.geolocation.getCurrentPosition((pos) => {
      const { latitude, longitude } = pos.coords;
      // Reverse-lookup a friendly name via the geocoding search on nearest coordinates isn't
      // directly supported, so label it generically and let the forecast timezone fill in detail.
      selectPlace({ name: 'Current location', admin1: '', country: '', latitude, longitude });
    }, () => {
      if(onFail) onFail();
      else showMessage('Could not get your location — search for a place instead.', true);
    });
  }

  locateBtn.addEventListener('click', () => useCurrentLocation());

  modelSelect.addEventListener('change', () => {
    if(currentPlace) loadForecast();
  });

  // ---------------- Forecast ----------------
  async function loadForecast(){
    if(!currentPlace) return;
    showMessage('Loading forecast…');
    hero.classList.remove('visible');
    hourlySection.style.display = 'none';
    dailySection.style.display = 'none';

    const { latitude, longitude } = currentPlace;
    const model = modelSelect.value;
    const params = new URLSearchParams({
      latitude, longitude,
      current: 'temperature_2m,apparent_temperature,weather_code,is_day',
      hourly: 'temperature_2m,weather_code,precipitation_probability,is_day',
      daily: 'weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max',
      timezone: 'auto',
      forecast_days: '16'
    });
    if(model) params.set('models', model);

    try{
      const res = await fetch(`${FORECAST_URL}?${params.toString()}`);
      if(!res.ok){
        const errBody = await res.json().catch(() => ({}));
        throw new Error(errBody.reason || `Request failed (${res.status})`);
      }
      const data = await res.json();
      renderForecast(data);
    }catch(err){
      showMessage(`Couldn't load the forecast — ${err.message}`, true);
    }
  }

  function renderForecast(data){
    messageArea.innerHTML = '';

    // ---- Hero ----
    const region = [currentPlace.admin1, currentPlace.country].filter(Boolean).join(', ');
    document.getElementById('placeLine').textContent = region ? `${currentPlace.name} · ${region}` : currentPlace.name;

    const cur = data.current;
    const [condLabel, condIcon] = weatherInfo(cur.weather_code, cur.is_day === 1, 'dark');
    applySky(cur.weather_code, cur.is_day === 1);
    document.getElementById('tempNow').textContent = Math.round(cur.temperature_2m);
    document.getElementById('heroIcon').innerHTML = condIcon;
    document.getElementById('conditionLine').textContent = condLabel;
    document.getElementById('feelsLine').textContent = `Feels like ${Math.round(cur.apparent_temperature)}°`;

    const todayHi = Math.round(data.daily.temperature_2m_max[0]);
    const todayLo = Math.round(data.daily.temperature_2m_min[0]);
    document.getElementById('hiloLine').textContent = `H:${todayHi}°  L:${todayLo}°`;

    hero.classList.add('visible');

    // ---- Hourly (next 48h from current hour) ----
    const nowIso = data.hourly.time.findIndex(t => new Date(t) >= new Date(cur.time));
    const startIdx = nowIso === -1 ? 0 : nowIso;
    const hourlyScroll = document.getElementById('hourlyScroll');
    let hourlyHtml = '';
    for(let i = startIdx; i < Math.min(startIdx + 48, data.hourly.time.length); i++){
      const t = new Date(data.hourly.time[i]);
      const isNow = i === startIdx;
      const label = isNow ? 'Now' : t.toLocaleTimeString([], { hour: 'numeric' });
      const [, icon] = weatherInfo(data.hourly.weather_code[i], data.hourly.is_day[i] === 1, 'light');
      const pop = data.hourly.precipitation_probability[i];
      hourlyHtml += `<div class="hour-col">
        <div class="h-time ${isNow ? 'now' : ''}">${label}</div>
        <div class="h-icon">${icon}</div>
        <div class="h-temp">${Math.round(data.hourly.temperature_2m[i])}°</div>
        <div class="h-pop">${pop >= 20 ? pop + '%' : ''}</div>
      </div>`;
    }
    hourlyScroll.innerHTML = hourlyHtml;
    hourlySection.style.display = 'block';

    // ---- Daily ----
    const days = data.daily.time.length;
    const allMins = data.daily.temperature_2m_min;
    const allMaxs = data.daily.temperature_2m_max;
    const rangeMin = Math.min(...allMins);
    const rangeMax = Math.max(...allMaxs);
    const span = Math.max(rangeMax - rangeMin, 1);

    const dailyList = document.getElementById('dailyList');
    let dailyHtml = '';
    for(let i = 0; i < days; i++){
      const t = new Date(data.daily.time[i] + 'T12:00:00');
      const dayLabel = i === 0 ? 'Today' : t.toLocaleDateString([], { weekday: 'short' });
      const dateSub = t.toLocaleDateString([], { day: 'numeric', month: 'short' });
      const [, icon] = weatherInfo(data.daily.weather_code[i], true, 'light');
      const lo = Math.round(allMins[i]);
      const hi = Math.round(allMaxs[i]);
      const leftPct = ((allMins[i] - rangeMin) / span) * 100;
      const widthPct = ((allMaxs[i] - allMins[i]) / span) * 100;
      const pop = data.daily.precipitation_probability_max[i];

      dailyHtml += `<div class="day-row">
        <div class="day-name">${dayLabel}<span class="date-sub">${dateSub}</span></div>
        <div class="day-icon">${icon}</div>
        <div class="day-range-wrap">
          <div class="range-values"><span class="lo">${lo}°</span><span class="hi">${hi}°</span></div>
          <div class="range-track"><div class="range-fill" style="left:${leftPct}%; width:${widthPct}%;"></div></div>
        </div>
        <div class="day-pop">${pop >= 20 ? pop + '%' : ''}</div>
      </div>`;
    }
    dailyList.innerHTML = dailyHtml;
    document.getElementById('dailyLabel').textContent = `${days}-DAY OUTLOOK`;
    dailySection.style.display = 'block';

    // ---- Footer ----
    const modelLabel = modelSelect.options[modelSelect.selectedIndex].text;
    const updated = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    footer.innerHTML = `Data: <a href="https://open-meteo.com" target="_blank" rel="noopener">Open-Meteo</a> · Model: ${escapeHtml(modelLabel)} · Updated ${updated}`;
  }

  function showMessage(text, isError){
    messageArea.innerHTML = `<div class="message ${isError ? 'error' : ''}">${escapeHtml(text)}</div>`;
  }

  // On open, try the visitor's current location first (like iOS Weather's first-launch
  // behaviour); fall back to a plain prompt to search if permission is denied/unavailable.
  useCurrentLocation(() => {
    showMessage('Search for a place in Europe to see its forecast, or allow location access to see yours.');
  });

})();
</script>

</body>
